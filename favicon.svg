<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Talk Studio mark (see src/assets/talkstudio-logo.svg). Seams a touch
       heavier than the nav copy so the five tiles survive a 16px tab icon. -->
  <defs>
    <clipPath id="c"><rect width="100" height="100" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)" stroke="#1b1923" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,0 42.4,0 26,61 0,54" fill="#cec7fc"/>
    <polygon points="42.4,0 100,0 100,53 33,35" fill="#5c4eda"/>
    <polygon points="100,53 100,100 43.4,100 59,42" fill="#a25239"/>
    <polygon points="43.4,100 0,100 0,54 52,68" fill="#188175"/>
    <polygon points="33,35 59,42 52,68 26,61" fill="#eec07b"/>
  </g>
</svg>
